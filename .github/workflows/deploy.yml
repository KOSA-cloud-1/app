name: Build Image and Update Kubernetes Manifest

on:
  push:
    branches:
      - dev

permissions:
  contents: read

env:
  REGISTRY_NAME: ${{ secrets.DOCKERHUB_USERNAME }}
  MANIFEST_REPO: KOSA-cloud-1/k8s-manifests
  MANIFEST_BRANCH: dev
  SERVICES: auth-server employee-server photo-service gateway

jobs:
  build-and-update-manifest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout app repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker images
        shell: bash
        run: |
          for service in $SERVICES; do
            image="$REGISTRY_NAME/$service:${{ github.sha }}"

            docker build -t "$image" "./$service"
            docker push "$image"
          done

      - name: Checkout k8s-manifest repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.MANIFEST_REPO }}
          ref: ${{ env.MANIFEST_BRANCH }}
          token: ${{ secrets.MANIFEST_REPO_TOKEN }}
          path: k8s-manifest

      - name: Update image tag in Kubernetes manifest
        shell: bash
        run: |
          cd k8s-manifest

          for service in $SERVICES; do
            image="$REGISTRY_NAME/$service:${{ github.sha }}"
            manifest="apps/$service/$service.yaml"

            sed -i "s|image: .*|image: $image|g" "$manifest"
            git add "$manifest"
          done

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git commit -m "chore: update image tag to ${{ github.sha }}" || echo "No changes to commit"
          git push origin $MANIFEST_BRANCH
